<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MoneyManager" />
    <title>MoneyManager</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <p class="eyebrow">MoneyManager</p>
        <h1>出勤と支出を、スマホでさっと記録。</h1>
        <p class="lede">今日のメモ、合計、履歴を1画面にまとめた軽量PWAです。</p>
      </header>

      <main class="content">
        <section class="card summary-card">
          <div class="summary-grid">
            <div>
              <span class="label">今月の出勤</span>
              <strong id="incomeTotal">¥0</strong>
            </div>
            <div>
              <span class="label">今月の支出</span>
              <strong id="expenseTotal">¥0</strong>
            </div>
            <div>
              <span class="label">差引</span>
              <strong id="balanceTotal">¥0</strong>
            </div>
          </div>
        </section>

        <section class="card form-card">
          <h2>入力</h2>
          <form id="entryForm" autocomplete="off">
            <div class="field-group">
              <label for="entryType">種別</label>
              <div class="segmented" role="radiogroup" aria-label="種別">
                <input type="radio" name="entryType" id="typeIncome" value="income" checked />
                <label for="typeIncome">出勤</label>
                <input type="radio" name="entryType" id="typeExpense" value="expense" />
                <label for="typeExpense">支出</label>
              </div>
            </div>

            <div class="field-grid">
              <div class="field">
                <label for="amount">金額</label>
                <input id="amount" name="amount" type="number" min="0" step="1" inputmode="numeric" placeholder="1000" required />
              </div>
              <div class="field">
                <label for="entryDate">日付</label>
                <input id="entryDate" name="entryDate" type="date" required />
              </div>
            </div>

            <div class="field">
              <label for="note">メモ</label>
              <input id="note" name="note" type="text" maxlength="40" placeholder="例: バイト代、昼食" />
            </div>

            <div class="actions">
              <button type="submit" class="primary">保存する</button>
              <button type="button" id="clearAllButton" class="secondary">全消去</button>
            </div>
          </form>
        </section>

        <section class="card history-card">
          <div class="section-head">
            <h2>履歴</h2>
            <button id="exportButton" type="button" class="ghost">JSON出力</button>
          </div>
          <ul id="entryList" class="entry-list" aria-live="polite"></ul>
          <p id="emptyState" class="empty-state">まだ記録がありません。</p>
        </section>
      </main>
    </div>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>MoneyManager - データ画面</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body data-page="data">
    <div class="app-shell">
      <header class="hero">
        <p class="eyebrow">MoneyManager</p>
        <h1>データを確認</h1>
        <p class="lede">月を切り替えて、一覧と集計を見られます。</p>
      </header>

      <nav class="page-nav" aria-label="画面切り替え">
        <a class="page-tab" href="./entry.html">登録画面</a>
        <a class="page-tab is-active" href="./data.html">データ画面</a>
      </nav>

      <main class="content">
        <section class="card summary-card">
          <div class="summary-grid">
            <div>
              <span class="label">今月の収入</span>
              <strong id="incomeTotal">¥0</strong>
            </div>
            <div>
              <span class="label">今月の支出</span>
              <strong id="expenseTotal">¥0</strong>
            </div>
            <div>
              <span class="label">残高</span>
              <strong id="balanceTotal">¥0</strong>
            </div>
          </div>
        </section>

        <section class="card chart-card">
          <div class="section-head">
            <h2>月ごとの残高推移</h2>
          </div>
          <div id="monthlyChart" class="monthly-chart" aria-label="月ごとの残高推移"></div>
        </section>

        <section class="card history-card">
          <div class="section-head section-head-wrap">
            <div>
              <h2>データ一覧</h2>
              <p id="monthLabel" class="month-label"></p>
            </div>
            <div class="month-controls">
              <button id="prevMonthButton" type="button" class="secondary">前月</button>
              <button id="currentMonthButton" type="button" class="secondary">今月</button>
              <button id="nextMonthButton" type="button" class="secondary">翌月</button>
              <button id="exportButton" type="button" class="ghost">JSON出力</button>
            </div>
          </div>
          <div id="daySummaryList" class="day-summary-list"></div>
          <ul id="entryList" class="entry-list" aria-live="polite"></ul>
          <p id="emptyState" class="empty-state">まだデータがありません。</p>
        </section>
      </main>
    </div>
  </body>
</html>
